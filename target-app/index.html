<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <h1>Todo 목록</h1>

    <form id="todo-form" class="todo-form" novalidate>
      <div class="input-area">
        <label class="sr-only" for="todo-input">할 일 입력</label>
        <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
        <p id="input-warning" class="input-warning" role="alert" hidden>할 일을 입력해주세요.</p>
      </div>
      <button type="submit" class="add-button">추가</button>
    </form>

    <ul id="todo-list" class="todo-list" aria-label="할 일 목록"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
