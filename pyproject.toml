[project]
name = "vision-dev-agents"
version = "0.1.0"
description = "Multi-agent autonomous software development pipeline (Planner / Developer / Reviewer / GUI Tester)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pyautogui>=0.9.54",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "streamlit>=1.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "orchestrator"]
